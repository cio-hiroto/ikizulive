<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テンプレートサイト</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/sort.css">
  <script src="https://code.jquery.com/jquery-3.3.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
</head>
<style>
  .splide {
  margin-block: 24px;
  margin-inline: auto;
}

.splide__slide {
  height: 200px;
  background-color: #7ba57b;
}

.splide__pagination {
  margin-block-start: 8px;
  gap: 4px;
  position: static;
}

.splide__pagination li {
  display: flex;
  width: 40px;
  height: 4px;
}

.splide__pagination__page {
  width: 100%;
  height: 100%;
  margin: 0;
  border-radius: 0;
  background: #ededed;
  position: relative;
  opacity: 1;
  color: #193219;
}

.splide__pagination__page::after {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  position: absolute;
  bottom: 0;
  will-change: width;
}

.splide__pagination__page.is-active {
  background: #ededed;
  transform: scale(1);
}

.splide__pagination__page.is-active::after {
  width: var(--playing-rate);
  background: currentColor;
}

</style>
<body>
  <!-- シンプルヘッダー (ハンバーガーメニューを廃止) -->
  <header class="site-header">
    <div class="container">
      <div class="logo">
        <a href="/">
          <span class="logo-icon" aria-hidden="true">▮</span>
          <span class="logo-text">KURASHICOM</span>
        </a>
      </div>
      <nav class="main-nav" aria-label="グローバルナビゲーション">
        <ul>
          <li><a href="#">メンバーの呟き</a></li>
          <li><a href="#">このサイトについて</a></li>
          <li><a href="#">お問い合わせ</a></li>
          <li><a href="#">更新履歴</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <section id="tweets-list" class="tweets-list-section">
      <div class="container">
        <div class="tweets-controls">
          <div class="sort-controls">
            <label>並び替え:
              <select id="sort-by">
                <option value="date">日付</option>
                <option value="author">投稿者</option>
                <option value="popularity">人気順</option>
              </select>
            </label>
            <label>順序:
              <select id="sort-order">
                <option value="desc">降順</option>
                <option value="asc">昇順</option>
              </select>
            </label>
          </div>
          <div class="filter-controls">
            <div class="filter-left">
              <label class="search-label">検索:
                <input type="search" id="search-box" placeholder="本文を検索（部分一致）">
              </label>
            </div>
            <div class="filter-right">
              <label>投稿者で絞り込み:
                <select id="filter-author">
                  <option value="all">すべて</option>
                </select>
              </label>
              <label class="hide-hashtags-label">
                <input type="checkbox" id="hide-hashtags">
                ハッシュタグを非表示
              </label>
              <button id="reset-filters" type="button">リセット</button>
            </div>
          </div>
        </div>

        <div id="tweets-container" class="tweets-container">
          <div class="loading">読み込み中…</div>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/slider.js"></script>
  <script src="/js/embed.js"></script>
  <script src="/js/slider_element.js"></script>
  <script src="/js/sort.js"></script>
</body>
</html>
